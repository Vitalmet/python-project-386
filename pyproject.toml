[tool.poetry]
name = "call-calendar"
version = "0.1.0"
description = "Веб-приложение «Календарь звонков»: бронирование звонков гостями на 14 дней вперёд"
authors = ["Vitalmet"]
readme = "README.md"
packages = [{ include = "calendar_app" }]

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.0.0"
flask-sqlalchemy = "^3.1.0"
flask-wtf = "^1.2.0"
email-validator = "^2.0.0"
flask-cors = "^6.0.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
